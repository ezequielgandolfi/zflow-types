# Generated by zflow: releases the packages under a v<version> tag the first time a version reaches main.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Release the packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version sdk/package.json)
          if gh release view "v$version" > /dev/null 2>&1; then
            git diff --quiet "v$version" HEAD -- sdk studio-sdk plugin-tools ||
              echo "::warning::The packages changed but v$version is already released. Bump SDK_VERSION in zflow to release them."
            exit 0
          fi
          mkdir packs
          for package in sdk studio-sdk plugin-tools; do npm pack "./$package" --pack-destination packs; done
          gh release create "v$version" packs/*.tgz --title "v$version" --notes "Plugin kit for zflow SDK $version"
